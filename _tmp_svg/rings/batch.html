<!DOCTYPE html>
<html><head><meta charset="UTF-8"></head>
<body>
<div id="host"></div>
<script>
const files = [
"Bieu_tuong_Vanh_1.svg","Bieu_tuong_Vanh_2.svg","Bieu_tuong_Vanh_4.svg","Bieu_tuong_Vanh_5.svg",
"Bieu_tuong_Vanh_7.svg","Bieu_tuong_Vanh_8.svg","Bieu_tuong_Vanh_9.svg","Bieu_tuong_Vanh_11.svg",
"Bieu_tuong_Vanh_12.svg","Bieu_tuong_Vanh_13.svg",
"Trong_dong_Dong_Son_Vanh_1.svg","Trong_dong_Dong_Son_Vanh_2.svg","Trong_dong_Dong_Son_Vanh_4.svg",
"Trong_dong_Dong_Son_Vanh_5.svg","Trong_dong_Dong_Son_Vanh_6.svg","Trong_dong_Dong_Son_Vanh_7.svg",
"Trong_dong_Dong_Son_Vanh_8.svg","Trong_dong_Dong_Son_Vanh_9.svg","Trong_dong_Dong_Son_Vanh_11.svg",
"Trong_dong_Dong_Son_Vanh_12.svg","Trong_dong_Dong_Son_Vanh_13.svg"
];
window.batchDone = false;
window.batchResults = {};
let remaining = files.length;
files.forEach(fname => {
  const img = new Image();
  img.onload = function(){
    const maxDim = 500;
    let w = img.naturalWidth || 500, h = img.naturalHeight || 500;
    const scale = maxDim / Math.max(w,h);
    w = Math.round(w*scale); h = Math.round(h*scale);
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0,0,w,h);
    ctx.drawImage(img,0,0,w,h);
    window.batchResults[fname] = cv.toDataURL('image/png');
    remaining--;
    if (remaining===0) window.batchDone = true;
  };
  img.onerror = function(){
    window.batchResults[fname] = 'ERROR';
    remaining--;
    if (remaining===0) window.batchDone = true;
  };
  img.src = fname;
});
</script>
</body></html>
