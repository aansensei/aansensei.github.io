<style id="an-rail-style">
  /* Left column of the project pages, redesigned as one quiet card:
     a small back link, then the contents as a vertical timeline whose line
     fills as the page is read. The column is sticky, so it follows the scroll.
     At 1024px and below the columns stack, so the timeline is replaced by a round button at the
     bottom left that opens the same list as a bottom sheet. */

  body {
    --rail-acc: var(--teal-l, #52c9b9);
    --rail-text: rgba(248, 244, 236, .92);
    --rail-bg: #0b0a1e;
    --rail-panel: rgba(8, 6, 28, .94);
    --rail-line: rgba(201, 162, 39, .32);
    --rail-soft: color-mix(in srgb, var(--rail-acc) 16%, transparent);
  }

  body.an-day-mode {
    --rail-text: #2c2c2c;
    --rail-bg: #f4fbff;
    --rail-panel: rgba(255, 255, 255, .96);
    --rail-line: rgba(10, 116, 144, .34);
    --rail-soft: color-mix(in srgb, var(--rail-acc) 12%, transparent);
  }

  html.an-has-toc .toc-title,
  html.an-has-toc .toc-list,
  html.an-has-toc .pisces-toc-title,
  html.an-has-toc .pisces-toc {
    display: none !important;
  }

  /* Left card */
  body .col-left,
  body .pisces-sidebar {
    padding: 22px 20px 20px !important;
  }

  /* The back link is a plain text link with an arrow */
  body .col-left a.back-btn,
  body .pisces-sidebar a.pisces-back,
  body.an-day-mode .col-left a.back-btn,
  body.an-day-mode .pisces-sidebar a.pisces-back {
    display: inline-flex !important;
    align-items: center;
    justify-content: flex-start;
    gap: 8px;
    width: auto;
    overflow: visible;
    margin: 0 0 22px !important;
    padding: 0;
    border: 0;
    border-radius: 0;
    background: none;
    box-shadow: none;
    font-size: 15px;
    font-weight: 600 !important;
    letter-spacing: .06em;
    white-space: normal;
    color: var(--rail-text) !important;
    opacity: .78;
    text-shadow: none !important;
    transform: none;
    transition: color .2s ease, opacity .2s ease !important;
  }

  body .col-left a.back-btn::after,
  body .pisces-sidebar a.pisces-back::after {
    display: none;
  }

  body .col-left a.back-btn:hover,
  body .pisces-sidebar a.pisces-back:hover,
  body.an-day-mode .col-left a.back-btn:hover,
  body.an-day-mode .pisces-sidebar a.pisces-back:hover {
    color: var(--rail-acc) !important;
    opacity: 1;
    text-shadow: none !important;
    transform: none;
    box-shadow: none;
  }

  body .col-left a.back-btn i,
  body .pisces-sidebar a.pisces-back i {
    font-size: 12px;
    transition: transform .25s ease;
  }

  body .col-left a.back-btn:hover i,
  body .pisces-sidebar a.pisces-back:hover i {
    transform: translateX(-4px);
  }

  /* Header of the left card: the avatar in a gold ring, centred, with the back link on one line
     under it and a hairline before the contents. Once the columns stack the card shrinks to the
     back link alone, so the avatar and the hairline are dropped. */
  .an-toc__head {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    margin: 0 0 20px;
    padding: 0 0 18px;
    border-bottom: 1px solid var(--rail-line);
  }

  body .col-left .an-toc__head a.back-btn,
  body .pisces-sidebar .an-toc__head a.pisces-back {
    margin: 0 !important;
    font-size: 14px;
    letter-spacing: .04em;
    white-space: nowrap;
  }

  .an-toc__face {
    flex: none;
    width: 76px;
    height: 76px;
    border: 2px solid var(--gold);
    border-radius: 50%;
    object-fit: cover;
    box-shadow: 0 0 0 5px var(--rail-soft), 0 14px 28px -14px rgba(0, 0, 20, .65);
    transition: transform .3s cubic-bezier(.22, 1, .36, 1), box-shadow .3s ease;
  }

  .an-toc__head:hover .an-toc__face {
    transform: scale(1.05);
    box-shadow: 0 0 0 7px var(--rail-soft), 0 16px 30px -14px rgba(0, 0, 20, .7);
  }

  @media (min-width: 1025px) and (max-height: 780px) {
    .an-toc__face {
      width: 56px;
      height: 56px;
    }

    .an-toc__head {
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 12px;
    }
  }

  @media (max-width: 1024px) {
    .an-toc__face {
      display: none;
    }

    .an-toc__head {
      margin: 0;
      padding: 0;
      border: 0;
    }
  }

  /* Contents timeline. On wide screens it is always open in the left card; on tablets and phones it
     sits at the top of the page as a collapsed row that opens when pressed. */
  .an-toc__toggle {
    display: none;
  }

  @media (min-width: 1025px) {
    .an-rail {
      display: none !important;
    }
  }

  @media (max-width: 1024px) {
    .an-toc {
      border: 1px solid var(--rail-line);
      border-radius: 12px;
      background: var(--rail-panel);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
    }

    .an-toc__label {
      display: none;
    }

    .an-toc__toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 48px;
      padding: 0 16px;
      border: 0;
      background: none;
      color: var(--rail-acc);
      font: 700 13px 'Cormorant Garamond', serif;
      letter-spacing: .2em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .an-toc__n {
      margin-left: auto;
      color: var(--rail-text);
      opacity: .65;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: none;
    }

    .an-toc__toggle svg {
      width: 16px;
      height: 16px;
      flex: none;
      transition: transform .25s ease;
    }

    .an-toc.is-expanded .an-toc__toggle svg {
      transform: rotate(180deg);
    }

    .an-toc__body {
      display: none;
      padding: 4px 16px 14px;
    }

    .an-toc.is-expanded .an-toc__body {
      display: block;
    }
  }

  .an-toc__label {
    margin: 0 0 12px;
    color: var(--rail-acc);
    font: 700 12px 'Cormorant Garamond', serif;
    letter-spacing: .24em;
    text-transform: uppercase;
  }

  .an-toc__list {
    position: relative;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .an-toc__list::before {
    content: '';
    position: absolute;
    left: 5px;
    top: var(--first, 14px);
    bottom: var(--last, 14px);
    width: 1px;
    background: var(--rail-line);
  }

  .an-toc__fill {
    position: absolute;
    left: 4px;
    top: var(--first, 14px);
    width: 3px;
    height: 0;
    border-radius: 3px;
    background: var(--rail-acc);
    transition: height .25s ease;
  }

  .an-toc__list li {
    margin: 0 !important;
  }

  body .an-toc .an-toc__item {
    position: relative;
    display: block;
    padding: 7px 0 7px 28px;
    color: var(--rail-text) !important;
    opacity: .7;
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    line-height: 1.35;
    text-decoration: none !important;
    border: 0 !important;
    transition: color .2s ease, opacity .2s ease !important;
  }

  .an-toc__item::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    width: 11px;
    height: 11px;
    margin-top: -5.5px;
    box-sizing: border-box;
    border: 1.5px solid var(--rail-line);
    border-radius: 50%;
    background: var(--rail-bg);
    transition: background-color .2s ease, border-color .2s ease, box-shadow .2s ease;
  }

  body .an-toc .an-toc__item:hover {
    color: var(--rail-acc) !important;
    opacity: 1;
  }

  /* The label is the part that is pulled toward the pointer, so the dots stay on the line.
     A soft plate fades in behind the entry under the pointer. */
  .an-toc__item {
    isolation: isolate;
  }

  .an-toc__text {
    display: block;
    will-change: transform;
  }

  .an-toc__item::after {
    content: '';
    position: absolute;
    z-index: -1;
    inset: 2px -8px 2px 18px;
    border-radius: 8px;
    background: var(--rail-soft);
    opacity: 0;
    transform: scale(.96);
    transition: opacity .2s ease, transform .3s cubic-bezier(.22, 1, .36, 1);
  }

  @media (hover: hover) and (pointer: fine) {
    .an-toc__item:hover::after,
    .an-toc__item:focus-visible::after {
      opacity: 1;
      transform: none;
    }
  }

  .an-toc__item.is-past::before {
    border-color: var(--rail-acc);
  }

  body .an-toc .an-toc__item.is-active {
    color: var(--rail-acc) !important;
    opacity: 1;
    font-weight: 700;
  }

  .an-toc__item.is-active::before {
    background: var(--rail-acc);
    border-color: var(--rail-acc);
    box-shadow: 0 0 0 4px var(--rail-soft);
  }

  .an-toc__item:focus-visible,
  .an-rail__item:focus-visible,
  .an-rail__fab:focus-visible {
    outline: 2px solid var(--rail-acc);
    outline-offset: 2px;
  }

  /* Tablets and phones: contents as a bottom sheet */
  .an-rail {
    position: fixed;
    inset: 0;
    z-index: 1500;
    pointer-events: none;
    font-family: 'Cormorant Garamond', serif;
  }

  body.an-bg-only .an-rail {
    display: none;
  }

  .an-rail__scrim {
    position: absolute;
    inset: 0;
    background: rgba(0, 8, 28, .5);
    opacity: 0;
    visibility: hidden;
    transition: opacity .3s ease, visibility 0s linear .3s;
  }

  .an-rail.is-open .an-rail__scrim {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transition: opacity .3s ease;
  }

  .an-rail__fab {
    position: absolute;
    left: max(14px, env(safe-area-inset-left));
    bottom: max(14px, env(safe-area-inset-bottom));
    min-height: 44px;
    padding: 0 16px 0 14px;
    display: flex;
    align-items: center;
    gap: 9px;
    border: 1px solid var(--rail-line);
    border-radius: 999px;
    background: var(--rail-panel);
    color: var(--rail-acc);
    font: 600 15px 'Cormorant Garamond', serif;
    letter-spacing: .06em;
    cursor: pointer;
    pointer-events: auto;
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    box-shadow: 0 14px 30px -16px rgba(0, 0, 20, .7);
    /* hidden while the contents row at the top of the page is still on screen */
    opacity: 0;
    visibility: hidden;
    transform: translateY(10px);
    transition: opacity .25s ease, transform .25s ease, visibility 0s linear .25s;
  }

  .an-rail.is-away .an-rail__fab,
  .an-rail.is-open .an-rail__fab {
    opacity: 1;
    visibility: visible;
    transform: none;
    transition: opacity .25s ease, transform .25s ease;
  }

  .an-rail__fab svg {
    width: 18px;
    height: 18px;
    flex: none;
  }

  .an-rail__list {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    max-height: 64vh;
    overflow-y: auto;
    margin: 0;
    padding: 6px 12px calc(76px + env(safe-area-inset-bottom));
    list-style: none;
    background: var(--rail-panel);
    border-top: 1px solid var(--rail-line);
    border-radius: 18px 18px 0 0;
    transform: translateY(105%);
    visibility: hidden;
    pointer-events: auto;
    transition: transform .35s cubic-bezier(.22, 1, .36, 1), visibility 0s linear .35s;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }

  .an-rail.is-open .an-rail__list {
    transform: none;
    visibility: visible;
    transition: transform .35s cubic-bezier(.22, 1, .36, 1);
  }

  .an-rail__list:focus {
    outline: none;
  }

  .an-rail__title {
    padding: 14px 12px 8px;
    color: var(--rail-acc);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .2em;
    text-transform: uppercase;
  }

  .an-rail__item {
    display: flex;
    align-items: center;
    min-height: 48px;
    padding: 0 12px;
    border-radius: 10px;
    color: var(--rail-text) !important;
    text-decoration: none !important;
    font-size: 17px;
    line-height: 1.3;
    border: 0 !important;
  }

  .an-rail__item.is-active {
    color: var(--rail-acc) !important;
    background: var(--rail-soft);
    font-weight: 700;
  }

  @media (prefers-reduced-motion: reduce) {
    .an-rail__list,
    .an-rail__scrim,
    .an-toc__fill,
    body .an-toc .an-toc__item,
    .an-toc__item::before,
    body .col-left .back-btn i {
      transition: none !important;
    }
  }
</style>
<script>
  // Builds the contents from the page's own hand-written list, so every project keeps its own
  // section names, and shows them as a timeline in the left card plus a bottom sheet for small
  // screens. Pages without such a list are left untouched.
  (function () {
    function init() {
      var list = document.querySelector('ul.toc-list, ul.pisces-toc');
      if (!list) return;

      var items = [];
      list.querySelectorAll('a[href^="#"]').forEach(function (a) {
        var id = decodeURIComponent(a.getAttribute('href').slice(1));
        var target = document.getElementById(id);
        if (target) {
          target.style.scrollMarginTop = '96px';
          items.push({ id: id, target: target, label: a.textContent.trim() });
        }
      });
      if (items.length < 3) return;

      var heading = document.querySelector('.toc-title, .pisces-toc-title');
      // The accent follows the colour of the page's own contents title, which differs per project
      // and per day or night, so it is read again once a theme change has finished fading.
      function readAccent() {
        if (!heading) return;
        var color = getComputedStyle(heading).color;
        if (color) document.documentElement.style.setProperty('--rail-acc', color);
      }
      readAccent();
      new MutationObserver(function () { setTimeout(readAccent, 1800); })
        .observe(document.body, { attributes: true, attributeFilter: ['class'] });

      var toc = document.createElement('div');
      toc.className = 'an-toc';
      toc.innerHTML = '<button type="button" class="an-toc__toggle" aria-expanded="false"><span>Contents</span><b class="an-toc__n"></b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button><p class="an-toc__label">Contents</p><div class="an-toc__body"></div>';
      var tocToggle = toc.querySelector('.an-toc__toggle');
      toc.querySelector('.an-toc__n').textContent = items.length + ' sections';
      var tl = document.createElement('ol');
      tl.className = 'an-toc__list';
      var fill = document.createElement('i');
      fill.className = 'an-toc__fill';
      fill.setAttribute('aria-hidden', 'true');
      tl.appendChild(fill);

      var nav = document.createElement('nav');
      nav.className = 'an-rail';
      nav.setAttribute('aria-label', 'Contents');
      var fab = document.createElement('button');
      fab.type = 'button';
      fab.className = 'an-rail__fab';
      fab.setAttribute('aria-expanded', 'false');
      fab.setAttribute('aria-controls', 'an-rail-list');
      fab.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h13"/></svg><span class="an-rail__count">Contents</span>';
      var scrim = document.createElement('div');
      scrim.className = 'an-rail__scrim';
      var ol = document.createElement('ol');
      ol.id = 'an-rail-list';
      ol.className = 'an-rail__list';
      ol.style.listStyle = 'none';
      ol.tabIndex = -1;
      var title = document.createElement('li');
      title.className = 'an-rail__title';
      title.textContent = 'Contents';
      ol.appendChild(title);

      var tlinks = [];
      var slinks = [];
      items.forEach(function (it) {
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.className = 'an-toc__item';
        a.href = '#' + it.id;
        var txt = document.createElement('span');
        txt.className = 'an-toc__text';
        txt.textContent = it.label;
        a.appendChild(txt);
        li.appendChild(a);
        tl.appendChild(li);
        tlinks.push(a);

        var li2 = document.createElement('li');
        var b = document.createElement('a');
        b.className = 'an-rail__item';
        b.href = '#' + it.id;
        b.textContent = it.label;
        li2.appendChild(b);
        ol.appendChild(li2);
        slinks.push(b);
      });

      toc.querySelector('.an-toc__body').appendChild(tl);
      list.insertAdjacentElement('afterend', toc);
      nav.appendChild(scrim);
      nav.appendChild(ol);
      nav.appendChild(fab);
      document.body.appendChild(nav);
      document.documentElement.classList.add('an-has-toc');

      // The avatar joins the back link in one header row at the top of the left card
      var back = document.querySelector('.col-left a.back-btn, .pisces-sidebar:not(.pisces-meta) a.pisces-back');
      if (back && !back.closest('.an-toc__head')) {
        var headRow = document.createElement('div');
        headRow.className = 'an-toc__head';
        var face = document.createElement('img');
        face.className = 'an-toc__face';
        face.src = '/assets/images/avatar.jpg';
        face.alt = '';
        face.width = 76;
        face.height = 76;
        face.decoding = 'async';
        back.parentNode.insertBefore(headRow, back);
        headRow.appendChild(face);
        headRow.appendChild(back);
      }

      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
      var holder = toc.closest('.col-left, .pisces-sidebar');

      function setOpen(open) {
        nav.classList.toggle('is-open', open);
        fab.setAttribute('aria-expanded', open ? 'true' : 'false');
        if (open) ol.focus({ preventScroll: true });
      }
      fab.addEventListener('click', function () { setOpen(!nav.classList.contains('is-open')); });
      scrim.addEventListener('click', function () { setOpen(false); });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && nav.classList.contains('is-open')) { setOpen(false); fab.focus(); }
      });

      function go(i, e) {
        e.preventDefault();
        items[i].target.scrollIntoView({ behavior: reduce.matches ? 'auto' : 'smooth', block: 'start' });
        if (history.replaceState) history.replaceState(null, '', '#' + items[i].id);
        setOpen(false);
        if (window.matchMedia('(max-width: 1024px)').matches) setExpanded(false);
      }

      // On small screens the list at the top of the page opens and closes
      function setExpanded(open) {
        toc.classList.toggle('is-expanded', open);
        tocToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        if (open) { measure(); onScroll(); }
      }
      tocToggle.addEventListener('click', function () { setExpanded(!toc.classList.contains('is-expanded')); });

      // The round button appears only once the list at the top has scrolled out of view
      if ('IntersectionObserver' in window) {
        new IntersectionObserver(function (entries) {
          nav.classList.toggle('is-away', !entries[0].isIntersecting);
        }).observe(toc);
      } else {
        nav.classList.add('is-away');
      }
      tlinks.forEach(function (a, i) { a.addEventListener('click', function (e) { go(i, e); }); });
      slinks.forEach(function (a, i) { a.addEventListener('click', function (e) { go(i, e); }); });

      // Magnetic pull: with a mouse, the label under the pointer follows it a few pixels and eases
      // back when the pointer leaves. Touch screens and reduced motion get no movement.
      if (window.matchMedia('(hover: hover) and (pointer: fine)').matches && !reduce.matches) {
        tlinks.forEach(function (a) {
          var span = a.querySelector('.an-toc__text');
          var cur = { x: 0, y: 0 };
          var goal = { x: 0, y: 0 };
          var raf = 0;
          function step() {
            cur.x += (goal.x - cur.x) * 0.2;
            cur.y += (goal.y - cur.y) * 0.2;
            var done = Math.abs(goal.x - cur.x) < 0.05 && Math.abs(goal.y - cur.y) < 0.05;
            if (done) { cur.x = goal.x; cur.y = goal.y; }
            span.style.transform = (cur.x || cur.y) ? 'translate3d(' + cur.x.toFixed(2) + 'px,' + cur.y.toFixed(2) + 'px,0)' : '';
            raf = done ? 0 : requestAnimationFrame(step);
          }
          function kick() { if (!raf) raf = requestAnimationFrame(step); }
          a.addEventListener('pointermove', function (e) {
            var r = a.getBoundingClientRect();
            var dx = (e.clientX - (r.left + r.width / 2)) * 0.1;
            var dy = (e.clientY - (r.top + r.height / 2)) * 0.25;
            goal.x = Math.max(-5, Math.min(8, dx + 4));
            goal.y = Math.max(-3, Math.min(3, dy));
            kick();
          });
          a.addEventListener('pointerleave', function () { goal.x = 0; goal.y = 0; kick(); });
        });
      }

      // Dot centres are measured so the fill line can end exactly at the section being read
      var centres = [];
      function measure() {
        centres = tlinks.map(function (a) { return a.parentNode.offsetTop + a.offsetHeight / 2; });
        if (!centres.length) return;
        tl.style.setProperty('--first', centres[0] + 'px');
        tl.style.setProperty('--last', (tl.offsetHeight - centres[centres.length - 1]) + 'px');
      }

      var active = -1;
      var ticking = false;
      function update() {
        ticking = false;
        var line = window.innerHeight * 0.3;
        var idx = 0;
        for (var i = 0; i < items.length; i++) {
          if (items[i].target.getBoundingClientRect().top <= line) idx = i;
        }
        var atEnd = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4;
        if (atEnd) idx = items.length - 1;

        if (centres.length) {
          var pos = centres[idx];
          if (idx < items.length - 1 && !atEnd) {
            var a0 = items[idx].target.getBoundingClientRect().top;
            var a1 = items[idx + 1].target.getBoundingClientRect().top;
            var f = a1 > a0 ? Math.min(1, Math.max(0, (line - a0) / (a1 - a0))) : 0;
            pos = centres[idx] + f * (centres[idx + 1] - centres[idx]);
          }
          fill.style.height = Math.max(0, pos - centres[0]) + 'px';
        }

        if (idx === active) return;
        active = idx;
        tlinks.forEach(function (a, i) {
          a.classList.toggle('is-active', i === idx);
          a.classList.toggle('is-past', i < idx);
          if (i === idx) a.setAttribute('aria-current', 'location'); else a.removeAttribute('aria-current');
        });
        slinks.forEach(function (a, i) { a.classList.toggle('is-active', i === idx); });
        var count = fab.querySelector('.an-rail__count');
        if (count) count.textContent = (idx + 1) + ' / ' + items.length;

        // Keep the current entry in view when the card is shorter than the list
        if (holder && holder.scrollHeight > holder.clientHeight + 2) {
          var cur = tlinks[idx];
          var top = cur.getBoundingClientRect().top - holder.getBoundingClientRect().top;
          if (top < 60 || top > holder.clientHeight - 60) {
            holder.scrollTop += top - holder.clientHeight / 2;
          }
        }
      }
      function onScroll() {
        if (!ticking) { ticking = true; requestAnimationFrame(update); }
      }
      function onResize() { measure(); onScroll(); }
      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', onResize);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(onResize);
      window.addEventListener('load', onResize);
      measure();
      update();
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
  })();
</script>
