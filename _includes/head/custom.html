<script>

  /* site-wide: any <img> that 404s (missing asset) shows a visible
     placeholder icon in its place instead of the browser's broken-image
     glyph, so missing images are obvious at a glance while browsing */
  document.addEventListener('error', function (e) {
    var img = e.target;
    if (!img || img.tagName !== 'IMG' || img.dataset.anMissing || img.src.indexOf('icon-missing-image.png') !== -1) return;
    img.dataset.anMissing = '1';
    var box = document.createElement('img');
    box.src = '/assets/images/icon-missing-image.png';
    box.alt = 'Missing image';
    box.title = 'Missing image: ' + img.getAttribute('src');
    box.style.cssText = 'width:' + (img.offsetWidth || img.width || 100) + 'px;height:' + (img.offsetHeight || img.height || 100) + 'px;object-fit:contain;opacity:.6;padding:8%;box-sizing:border-box;';
    img.style.display = 'none';
    img.insertAdjacentElement('afterend', box);
  }, true);
</script>

<!-- background-peek: tiny eye toggle, top-left. Click hides all UI chrome
     (nav, sidebar, page content, footer, cursor) leaving only the ambient
     background visible; click anywhere to bring it all back. -->
<style>
  #an-bg-peek {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 999998;
    width: 26px;
    height: 26px;
    padding: 0;
    border: 1px solid rgba(201, 162, 39, .5);
    background: rgba(10, 8, 25, .7);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: .8;
    transition: opacity .3s ease, transform .2s ease;
    box-shadow: 0 0 8px rgba(0, 0, 0, .5);
  }

  #an-bg-peek svg path,
  #an-bg-peek svg circle {
    stroke: #f0c84a !important;
  }

  #an-bg-peek:hover {
    opacity: 1;
    transform: scale(1.1);
  }

  #an-bg-peek,
  .masthead,
  .initial-content,
  .page__footer,
  #an-top {
    transition: opacity .45s ease, visibility 0s linear 0s;
  }

  body.an-bg-only #an-bg-peek,
  body.an-bg-only .masthead,
  body.an-bg-only .initial-content,
  body.an-bg-only .page__footer,
  body.an-bg-only #an-top {
    opacity: 0 !important;
    visibility: hidden !important;
    pointer-events: none !important;
    transition: opacity .45s ease, visibility 0s linear .45s !important;
  }
</style>
<button id="an-bg-peek" type="button" title="Peek at the background"
  aria-label="Hide page content, show only the background">
  <svg viewBox="0 0 24 24" width="13" height="13" fill="none">
    <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" stroke="rgba(201,162,39,.75)" stroke-width="1.4" />
    <circle cx="12" cy="12" r="3.1" stroke="rgba(201,162,39,.85)" stroke-width="1.4" />
  </svg>
</button>
<script>
  (function () {
    var btn = document.getElementById('an-bg-peek');
    if (!btn) return;
    /* .author__urls-wrapper elements get an inline visibility:visible!important
       set by another script; inline !important beats any stylesheet rule
       (even !important ones), so it must be overridden inline too. */
    function forcedVisibleEls() {
      return document.querySelectorAll('.author__urls-wrapper, .author__urls-wrapper nav, .author__urls-wrapper .author__urls');
    }
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      document.body.classList.add('an-bg-only');
      /* delay to match the .45s fade-out on everything else, so this
         doesn't pop hidden before the rest finishes fading */
      setTimeout(function () {
        forcedVisibleEls().forEach(function (el) { el.style.setProperty('visibility', 'hidden', 'important'); });
      }, 450);
    });
    document.addEventListener('click', function () {
      if (document.body.classList.contains('an-bg-only')) {
        document.body.classList.remove('an-bg-only');
        forcedVisibleEls().forEach(function (el) { el.style.setProperty('visibility', 'visible', 'important'); });
      }
    });
  })();
</script>

<style id="an-theme-blocker">
  *,
  *::before,
  *::after {
    transition: none !important;
    animation: none !important;
  }
</style>

<script>
  /* khởi tạo theme sớm, tránh flash */
  (function () {
    try {
      var KTHEME = 'an_theme', KTS = 'an_ts', KACT = 'an_act', TTL = 300000;
      var now = Date.now();
      var act = +sessionStorage.getItem(KACT) || 0;

      if (act && now - act > TTL) {
        sessionStorage.removeItem(KTHEME);
        sessionStorage.removeItem(KTS);
      }
      var sv = sessionStorage.getItem(KTHEME);
      var ts = +sessionStorage.getItem(KTS) || 0;
      var isDay = (sv === 'day' && now - ts < TTL);
      sessionStorage.setItem(KACT, now);

      function applyTheme() {
        if (!document.body) return false;

        if (isDay) document.body.classList.add('an-day-mode');
        else document.body.classList.remove('an-day-mode');

        void document.body.offsetHeight;

        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            var blocker = document.getElementById('an-theme-blocker');
            if (blocker) blocker.remove();
          });
        });
        return true;
      }

      if (!applyTheme()) {
        var obs = new MutationObserver(function () {
          if (document.body) {
            applyTheme();
            obs.disconnect();
          }
        });
        obs.observe(document.documentElement, { childList: true });
        document.addEventListener('DOMContentLoaded', applyTheme);
      }
    } catch (e) { }
  })();
</script>

    position: fixed;

    border: 1px solid rgba(201, 162, 39, .35);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999998;
    transform: translate(-50%, -50%);

    align-items: center;
    justify-content: center;
  }

    border-color: rgba(184, 134, 11, .45);
  }

  #an-ring::before,
  #an-ring::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  #an-ring::before {
    width: calc(100% + 14px);
    height: calc(100% + 14px);
    border: 1px dashed rgba(240, 200, 74, 0.7);
    animation: anRingSpin 7s linear infinite;
  }

  #an-ring::after {
    width: calc(100% + 28px);
    height: calc(100% + 28px);
    border: 1px dotted rgba(255, 248, 235, 0.5);
    animation: anRingSpinRev 10s linear infinite;
  }

  body.an-day-mode #an-ring::before {
    border-color: rgba(210, 105, 30, 0.8);
  }

  body.an-day-mode #an-ring::after {
    border-color: rgba(184, 134, 11, 0.6);
  }

    height: 52px !important;
    border-color: rgba(240, 200, 74, 0.9) !important;

  }

  #an-ring.noble-hover::after {

  }

  @keyframes anRingSpin {

            ctx.beginPath(); ctx.ellipse(lx - 2 * fsc, ly + 2 * fsc, 1.4 * fsc, 2.4 * fsc, 0.3, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(lx + 2 * fsc, ly + 2 * fsc, 1.4 * fsc, 2.4 * fsc, -0.3, 0, Math.PI * 2); ctx.fill();
          }

        } else if (fl.type === 'cosmos') {
          for (var i = 0; i < 8; i++) {
            ctx.save(); ctx.rotate(i * Math.PI / 4);
            ctx.fillStyle = 'rgba(222,98,158,' + alp + ')';
            ctx.beginPath(); ctx.ellipse(0, -8 * fsc, 3.5 * fsc, 9 * fsc, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
          }
          ctx.fillStyle = 'rgba(255,192,55,' + alp + ')';
          ctx.beginPath(); ctx.arc(0, 0, 4 * fsc, 0, Math.PI * 2); ctx.fill();

        } else if (fl.type === 'daisy') {
          for (var i = 0; i < 10; i++) {
            ctx.save(); ctx.rotate(i * Math.PI / 5);
            ctx.fillStyle = 'rgba(255,250,228,' + alp + ')';
            ctx.beginPath(); ctx.ellipse(0, -7 * fsc, 2.5 * fsc, 7 * fsc, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
          }
          ctx.fillStyle = 'rgba(255,205,38,' + alp + ')';
          ctx.beginPath(); ctx.arc(0, 0, 3.5 * fsc, 0, Math.PI * 2); ctx.fill();

        } else if (fl.type === 'buttercup') {
          for (var i = 0; i < 5; i++) {
            ctx.save(); ctx.rotate(i * Math.PI * 2 / 5);
            ctx.fillStyle = 'rgba(255,208,18,' + alp + ')';
            ctx.beginPath(); ctx.ellipse(0, -5 * fsc, 4 * fsc, 6 * fsc, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
          }
          ctx.fillStyle = 'rgba(38,65,12,' + alp + ')';
          ctx.beginPath(); ctx.arc(0, 0, 2.2 * fsc, 0, Math.PI * 2); ctx.fill();

        } else { // bluebell
          for (var j = 0; j < 3; j++) {
            ctx.save(); ctx.translate((j - 1) * 4.5 * fsc, -j * 7 * fsc);
            ctx.fillStyle = 'rgba(78,118,208,' + alp + ')';
            ctx.beginPath(); ctx.moveTo(-3 * fsc, 0); ctx.bezierCurveTo(-3 * fsc, -5 * fsc, 3 * fsc, -5 * fsc, 3 * fsc, 0); ctx.bezierCurveTo(3 * fsc, 5 * fsc, -3 * fsc, 5 * fsc, -3 * fsc, 0); ctx.fill(); ctx.restore();
          }
        }
        ctx.restore();
      });

      // ── Cánh hoa / hạt phấn bay ──
      MPETALS.forEach(function (p) {
        var px = (p.x + Math.sin(nt * p.sp + p.ph) * 0.055) * W;
        var rawY = (p.y - nt * p.sp * 0.038) % 1;
        var py = bY + ((rawY + 1) % 1) * mH;
        var wobble = Math.sin(nt * 1.8 + p.ph) * 4;
        ctx.globalAlpha = a * t * (0.28 + 0.32 * Math.abs(Math.sin(nt * 0.85 + p.ph)));
        ctx.fillStyle = 'hsla(' + p.hue + ',65%,75%,1)';
        ctx.save(); ctx.translate(px + wobble, py); ctx.rotate(nt * p.sp + p.ph);
        ctx.beginPath(); ctx.ellipse(0, 0, p.r * sc, p.r * 0.45 * sc, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      });

      ctx.globalAlpha = a * t;
      ctx.restore();
    }

    function drawRiver(a, t) {
      var riverA = a * (1 - t);
      if (riverA < 0.01) return;
      var bY = H * (H > W ? 0.65 : 0.82);
      var nt = activeTime * 0.001;
      var sc = Math.max(W / 1280, H > W ? 1.2 : 0.4);

      try {
        var baseTransform = ctx.getTransform ? ctx.getTransform() : null;
        ctx.save();
        ctx.globalAlpha = riverA;
        var isMobile = H > W;
        var lotusCount = isMobile ? 3 : 7;
        var lanternCount = isMobile ? 6 : 18;
        if (!window._RIVER_INIT_V8 || !window._river_lanterns || window._river_lanterns.length !== lanternCount) {
          window._RIVER_INIT_V8 = true;
          
          var allPos = [];
          function getValidPos(minD) {
            for(var tries=0; tries<50; tries++) {
              var nx = Math.random(), ny = Math.random();
              var ok = true;
              for(var j=0; j<allPos.length; j++) {
                var dx = nx - allPos[j].x, dy = (ny - allPos[j].y) * 2.5; 
                if (dx*dx + dy*dy < minD*minD) { ok = false; break; }
              }
              if (ok) {
                allPos.push({x: nx, y: ny});
                return {x: nx, y: ny};
              }
            }
            var fb = {x: Math.random(), y: Math.random()};
            allPos.push(fb);
            return fb;
          }

          window._river_lotuses = [];
          for (var i = 0; i < lotusCount; i++) { // Adaptive lotus count
            var p = getValidPos(0.09);
            window._river_lotuses.push({
              x: p.x, y: p.y,
              speed: 0.002 + Math.random() * 0.003, // Faster drifting
              scale: 0.7 + Math.random() * 0.6,
              phase: Math.random() * Math.PI * 2
            });
          }

          window._river_lanterns = [];
          for (var i = 0; i < lanternCount; i++) { // Adaptive lantern count
            var p = getValidPos(0.06);
            window._river_lanterns.push({
              x: p.x, y: p.y,
              speed: 0.004 + Math.random() * 0.004, // Noticeably faster drifting
              scale: 0.7 + Math.random() * 0.6, // Matching scale logic
              phase: Math.random() * Math.PI * 2,
              hue: [340, 350, 0, 10, 20, 30, 40, 45, 320, 330][Math.floor(Math.random() * 10)]
            });
          }
          
          window._river_bubbles = [];
          window._river_fishes = [];
        }

        // Water Base (Darker, more natural)
        var rGrad = ctx.createLinearGradient(0, bY, 0, H);
        rGrad.addColorStop(0, 'rgba(4, 12, 28, 1)'); // Slightly bluer water surface
        rGrad.addColorStop(0.5, 'rgba(6, 20, 45, 1)'); // Deeper blue-teal midpoint
        rGrad.addColorStop(1, 'rgba(10, 30, 60, 1)'); // Deep ocean blue at bottom
        ctx.fillStyle = rGrad;
        ctx.fillRect(0, bY, W, H - bY);

        // Castle Reflection
        try {
          ctx.save();
          ctx.beginPath(); ctx.rect(0, bY, W, H - bY); ctx.clip();
          
          var swayX = Math.sin(activeTime * 0.001 * 1.5) * 1.2 * sc;
          
          ctx.save();
          ctx.translate(0, 2 * bY);
          ctx.scale(1, -1);
          
          // Simulate blur with offset drawing to avoid severe lag from ctx.filter
          var isMob = H > W;
          if (isMob) {
            // Draw a very simplified, faint silhouette for mobile to avoid Safari rendering lag/bugs
            var VW_m = 900;
            var s_m = Math.max(VW_m / 1280, 0.9) * 1.1 * 1.25;
            var cx_m = VW_m / 2, cy_m = bY;
            
            ctx.save();
            ctx.translate((W - VW_m) / 2, 0); 
            ctx.globalAlpha = riverA;
            
            // Draw 2 passes for blur
            for(var pass=0; pass<2; pass++) {
              ctx.save();
              ctx.translate((pass===0 ? swayX : -swayX*1.5), (pass===0 ? 1 : -0.5)*sc);
              
              var alphaC = (pass===0 ? 0.25 : 0.15);
              var cWall = 'rgba(90, 25, 15, ' + alphaC + ')'; // Warm dim red for walls
              var cRoof = 'rgba(120, 80, 20, ' + alphaC + ')'; // Warm dim gold for roofs
              
              // Base Wall
              var w1 = 600 * s_m, h1 = 120 * s_m;
              ctx.fillStyle = cWall;
              ctx.fillRect(cx_m - w1/2, cy_m - h1, w1, h1);
              
              // Tier 1 Roof
              var rw1 = 700 * s_m, rh1 = 40 * s_m, ry1 = cy_m - h1 - 5 * s_m;
              ctx.fillStyle = cRoof; ctx.beginPath();
              ctx.moveTo(cx_m - rw1/2, ry1); ctx.lineTo(cx_m + rw1/2, ry1);
              ctx.lineTo(cx_m + (rw1/2 - 25*s_m), ry1 - rh1); ctx.lineTo(cx_m - (rw1/2 - 25*s_m), ry1 - rh1);
              ctx.fill();
              
              // Tier 2 Wall
              var floor2Y = cy_m - h1 - 35 * s_m;
              var w2 = 480 * s_m, h2 = 45 * s_m;
              ctx.fillStyle = cWall;
              ctx.fillRect(cx_m - w2/2, floor2Y - h2, w2, h2);
              
              // Tier 2 Roof
              var rw2 = 540 * s_m, rh2 = 60 * s_m, ry2 = floor2Y - h2 - 5 * s_m;
              ctx.fillStyle = cRoof; ctx.beginPath();
              ctx.moveTo(cx_m - rw2/2, ry2); ctx.lineTo(cx_m + rw2/2, ry2);
              ctx.lineTo(cx_m + (rw2/2 - 45*s_m), ry2 - rh2); ctx.lineTo(cx_m - (rw2/2 - 45*s_m), ry2 - rh2);
              ctx.fill();
              
              // Tier 3 Wall
              var floor3Y = floor2Y - h2 - 55 * s_m;
              var w3 = 280 * s_m, h3 = 45 * s_m;
              ctx.fillStyle = cWall;
              ctx.fillRect(cx_m - w3/2, floor3Y - h3, w3, h3);
              
              // Tier 3 Roof
              var rw3 = 340 * s_m, rh3 = 70 * s_m, ry3 = floor3Y - h3 - 5 * s_m;
              ctx.fillStyle = cRoof; ctx.beginPath();
              ctx.moveTo(cx_m - rw3/2, ry3); ctx.lineTo(cx_m + rw3/2, ry3);
              ctx.lineTo(cx_m + (rw3/2 - 55*s_m), ry3 - rh3); ctx.lineTo(cx_m - (rw3/2 - 55*s_m), ry3 - rh3);
              ctx.fill();
              
              ctx.restore();
            }
            ctx.restore();
          } else {
            var refA = riverA * 0.1; 
            ctx.save(); ctx.translate(swayX * 0.8, 1 * sc); drawCastle(refA, t, true); ctx.restore();
            ctx.save(); ctx.translate(-swayX * 1.5, -0.5 * sc); drawCastle(refA * 0.7, t, true); ctx.restore();
          }
          ctx.restore();
        } catch (err) {
        } finally {

          if (baseTransform) ctx.setTransform(baseTransform);
        }

        // Wind Ripples on Water Surface (Shimmering, NOT moving like ducks)
        var windCycle = Math.max(0, Math.sin(nt * 0.2)); 
        if (windCycle > 0.01) {
          ctx.globalAlpha = riverA * 0.06 * windCycle;
          ctx.fillStyle = '#ffffff';
          for (var i = 0; i < 15; i++) {
            var ry = bY + (H - bY) * (i / 14);
            // Long, spanning width of the screen, just shifting/breathing slightly
            var rw = W * (0.3 + 0.5 * Math.sin(nt * 0.8 + i * 1.3)); 
            var rx = W * 0.5 + Math.sin(nt * 0.4 + i * 2.1) * W * 0.2;
            
            ctx.beginPath();
            ctx.ellipse(rx, ry, Math.max(0.1, rw), Math.max(0.1, 0.4 * sc), 0, 0, Math.PI*2);
            ctx.fill();
          }
        }
        ctx.globalAlpha = riverA;

        // Surface Popping Bubbles (Bọt nước nổ trên mặt)
        if (Math.random() < 0.1 && window._river_bubbles.length < 25) {
          window._river_bubbles.push({
            x: Math.random(),
            y: Math.random(), // Random Y on surface
            life: 1.0,
            size: (1 + Math.random() * 2) * sc
          });
        }
        
        ctx.lineWidth = 1 * sc;
        for (var i = window._river_bubbles.length - 1; i >= 0; i--) {
          var b = window._river_bubbles[i];
          b.life -= 0.015;
          if (b.life <= 0) { window._river_bubbles.splice(i, 1); continue; }
          
          var bx = b.x * W;
          var by = bY + b.y * (H - bY); // Position on the river surface
          
          ctx.globalAlpha = riverA * b.life * 0.6;
          ctx.strokeStyle = 'rgba(255, 255, 255, ' + b.life + ')';
          
          ctx.beginPath();
          var r = b.size + (1 - b.life) * 8 * sc;
          ctx.ellipse(bx, by, Math.max(0.1, r), Math.max(0.1, r * 0.3), 0, 0, Math.PI * 2);
          ctx.stroke();
        }

        // Fishes
        for (var i = window._river_fishes.length - 1; i >= 0; i--) {
          var f = window._river_fishes[i];
          if (f.state === 'jumping') {
            f.x += f.vx / W; f.y += f.vy; f.vy += 0.3 * sc; // stronger gravity
            
            // Draw real koi fish!
            ctx.save();
            ctx.translate(f.x * W, f.y);
            ctx.rotate(Math.atan2(f.vy, f.vx));
            var fSc = 1.2 * sc;
            ctx.scale(fSc, fSc);
            
            // Fish Body (Orange/Red)
            ctx.fillStyle = '#cc3300';
            ctx.beginPath();
            ctx.moveTo(10, 0); // nose
            ctx.quadraticCurveTo(5, -6, -8, -3); // top back
            ctx.quadraticCurveTo(-14, -5, -16, -6); // top tail
            ctx.lineTo(-13, 0); // tail center
            ctx.lineTo(-16, 6); // bot tail
            ctx.quadraticCurveTo(-14, 5, -8, 3); // bot belly
            ctx.quadraticCurveTo(5, 6, 10, 0); // belly to nose
            ctx.fill();

            // Pectoral fin
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.beginPath(); ctx.moveTo(2, 3); ctx.lineTo(-3, 8); ctx.lineTo(-1, 3); ctx.fill();
            
            // Eye
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(6, -1.5, 1.5, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.arc(6.5, -1.5, 0.7, 0, Math.PI*2); ctx.fill();
            
            ctx.restore();

            // Splash trail
            ctx.globalAlpha = riverA * 0.3;
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(f.x * W - f.vx*2, f.y - f.vy*2, Math.max(0.1, 1.5 * sc), 0, Math.PI*2); ctx.fill();
            
            if (f.y > f.startY) { f.state = 'rippling'; f.life = 1; f.y = f.startY; }
          } else if (f.state === 'rippling') {

            ctx.strokeStyle = 'rgba(200, 230, 255, 0.8)'; 
            ctx.lineWidth = 1.5 * sc;
            ctx.beginPath();
            ctx.ellipse(f.x * W, f.y, Math.max(0.1, (1 - f.life) * 40 * sc), Math.max(0.1, (1 - f.life) * 12 * sc), 0, 0, Math.PI * 2);
            ctx.stroke();
            
            ctx.globalAlpha = riverA * Math.max(0, f.life - 0.2);
            ctx.beginPath();
            ctx.ellipse(f.x * W, f.y, Math.max(0.1, (1 - f.life) * 20 * sc), Math.max(0.1, (1 - f.life) * 6 * sc), 0, 0, Math.PI * 2);
            ctx.stroke();
          }
        }
        ctx.globalAlpha = riverA;

        // Define render functions
        function drawLotusObj(lo, isRefl) {
            var lx = lo.x * W;
            var ly = bY + lo.y * (H - bY);
            // Apply perspective scaling: smaller in background (y=0), larger in foreground (y=1)
            var ls = (lo.scale * 0.4 + lo.y * 1.5) * sc * 1.1; 
            var sway = 0; // No sway
            var yBob = 0; // No bobbing
            var rot = 0; // No rotation
            
            try {
              ctx.save();
              if (isRefl) {
                var noise = Math.sin(nt * 4 + lo.phase + lo.y * 10) * 0.03; // Very subtle water ripple shear
                ctx.translate(lx + sway, ly + yBob); // Reflection touches the base perfectly
                ctx.transform(1, 0, noise, -1.2, 0, 0); // shear and stretch
                ctx.rotate(-rot);
                ctx.globalAlpha = riverA * 0.04; // Very dim reflection because it doesn't emit light
              } else {
                ctx.translate(lx + sway, ly + yBob);
                ctx.rotate(rot);
                ctx.globalAlpha = riverA * 0.9;

                pG.addColorStop(0, c1); pG.addColorStop(1, c2);

                ctx.beginPath();
                var w = 3.5 * scaleX, h = 10 * scaleY;

                }
                ctx.restore();

              // Base layer petals (darker pink, spread out completely)
              drawRealPetal(-1.3, 1.4*ls, 0.5*ls, 0.5*ls, '#c93264', '#ff80af');
              drawRealPetal(1.3, 1.4*ls, 0.5*ls, 0.5*ls, '#c93264', '#ff80af');
              drawRealPetal(-0.9, 1.3*ls, 0.7*ls, 0, '#d94179', '#ff99c2');
              drawRealPetal(0.9, 1.3*ls, 0.7*ls, 0, '#d94179', '#ff99c2');
              
              // Middle layer petals (brighter pink)
              drawRealPetal(-0.5, 1.1*ls, 0.9*ls, -0.5*ls, '#e8528f', '#ffb3d1');
              drawRealPetal(0.5, 1.1*ls, 0.9*ls, -0.5*ls, '#e8528f', '#ffb3d1');
              
              // Inner layer petals (very light pink/white, standing up)
              drawRealPetal(-0.25, 0.9*ls, 1.0*ls, -1*ls, '#f76a9a', '#ffffff');
              drawRealPetal(0.25, 0.9*ls, 1.0*ls, -1*ls, '#f76a9a', '#ffffff');
              drawRealPetal(0, 1.0*ls, 1.2*ls, -1.5*ls, '#ff80af', '#ffffff'); // Center petal

                cG.addColorStop(0, '#ffcc00'); cG.addColorStop(1, '#ff9900');
                ctx.fillStyle = cG;
                ctx.beginPath(); ctx.ellipse(0, -2.5*ls, Math.max(0.1, 2.5*ls), Math.max(0.1, 1.5*ls), 0, 0, Math.PI*2); ctx.fill();
              }
            } finally {
              ctx.restore();
            }
        }

        function drawLanternObj(la, isRefl) {
            var lx = la.x * W;
            var ly = bY + la.y * (H - bY);
            // Apply perspective scaling: smaller in background (y=0), larger in foreground (y=1)
            var ls = (la.scale * 0.4 + la.y * 1.5) * sc * 1.1;
            
            var sway = Math.sin(nt * 0.4 + la.phase) * 15 * ls;
            var yBob = Math.cos(nt * 0.6 + la.phase) * 3 * ls;
            var rot = Math.sin(nt * 0.4 + la.phase) * 0.1;
            
            try {
              ctx.save();
              if (isRefl) {
                var noise = Math.sin(nt * 4 + la.phase + la.y * 10) * 0.03; // Very subtle water ripple shear
                ctx.translate(lx + sway, ly + yBob); // Reflection touches the base perfectly
                ctx.transform(1, 0, noise, -1.2, 0, 0); // shear and stretch
                ctx.rotate(-rot);
                ctx.globalAlpha = riverA * (0.18 + 0.05 * Math.sin(nt * 3 + la.phase)); // Dimmer but glowing reflection
              } else {
                ctx.translate(lx + sway, ly + yBob);
                ctx.rotate(rot);
                ctx.globalAlpha = riverA * (0.85 + 0.15 * Math.sin(nt * 3 + la.phase));
              }

              var h = la.hue || 340;
              // Ambient Glow
              if (!isRefl) {
                var glow = ctx.createRadialGradient(0, -2.5*ls, 0, 0, -2.5*ls, Math.max(0.1, 40 * ls));
                glow.addColorStop(0, 'hsla(' + h + ', 100%, 75%, 0.45)');
                glow.addColorStop(0.3, 'hsla(' + (h + 15) + ', 100%, 65%, 0.15)');

                ctx.save();
                ctx.scale(1.8, 0.5); // Spread reflection horizontally for water ripple effect
                var refGlow = ctx.createRadialGradient(0, -2.5*ls/0.5, 0, 0, -2.5*ls/0.5, Math.max(0.1, 60 * ls));
                refGlow.addColorStop(0, 'hsla(' + h + ', 100%, 75%, 0.35)');
                refGlow.addColorStop(0.3, 'hsla(' + (h + 15) + ', 100%, 65%, 0.1)');
                refGlow.addColorStop(1, 'transparent');
                ctx.fillStyle = refGlow;
                ctx.globalCompositeOperation = 'lighter';
                ctx.beginPath(); ctx.arc(0, -2.5*ls/0.5, Math.max(0.1, 60 * ls), 0, Math.PI * 2); ctx.fill();
                ctx.globalCompositeOperation = 'source-over';
                ctx.restore();
              }

              // Leaf Pad for lantern
              ctx.fillStyle = '#1a4020';
              ctx.beginPath(); ctx.ellipse(0, 0, Math.max(0.1, 15 * ls), Math.max(0.1, 4 * ls), 0, 0, Math.PI * 2); ctx.fill();

              function drawLanternPetal(pRot, scaleX, scaleY, yOffset, c1, c2) {
                ctx.save();
                ctx.translate(0, yOffset);
                ctx.rotate(pRot);
                var pG = ctx.createLinearGradient(0, 0, 0, -10*scaleY);
                pG.addColorStop(0, c1);
                pG.addColorStop(1, c2);
                ctx.fillStyle = pG;
                ctx.beginPath();
                var w = 3.5 * scaleX, h = 10 * scaleY;
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(w, -h * 0.4, w * 0.9, -h * 0.8, 0, -h);
                ctx.bezierCurveTo(-w * 0.9, -h * 0.8, -w, -h * 0.4, 0, 0);
                ctx.fill();
                
                if (!isRefl) {
                  ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)'; 
                  ctx.lineWidth = 0.5 * sc; 
                  ctx.stroke();
                }
                ctx.restore();

            { y: 0.06, col1: 'rgba(0,255,160,', col2: 'rgba(0,180,255,', amp: 0.035, spd: 0.8, wv: 3.5 },
            { y: 0.12, col1: 'rgba(100,50,220,', col2: 'rgba(150,50,255,', amp: 0.028, spd: 0.6, wv: 2.8 },
            { y: 0.18, col1: 'rgba(0,220,200,', col2: 'rgba(0,140,255,', amp: 0.030, spd: 1.0, wv: 4.5 },
          ];
          bands.forEach(function (b) {
            ctx.save(); ctx.globalAlpha = starAlpha;
            var baseY = b.y * H, tTime = activeTime * 0.0003;
            ctx.beginPath(); ctx.moveTo(0, H); ctx.lineTo(0, baseY);
            for (var xi = 0; xi <= 100; xi++) {
              var xp = (xi / 100) * W;
              var wave = Math.sin(xi / 100 * Math.PI * b.wv + tTime * b.spd * 2) * b.amp * H
                + Math.sin(xi / 100 * Math.PI * b.wv * 1.6 + tTime * b.spd * 1.3 + 1.2) * b.amp * 0.5 * H;
              ctx.lineTo(xp, baseY + wave);
            }
            ctx.lineTo(W, H); ctx.closePath();
            var grad = ctx.createLinearGradient(0, baseY - H * 0.15, 0, H);
            var pulse = 0.04 + 0.03 * Math.sin(nt * 0.3 + b.spd);
            grad.addColorStop(0, b.col1 + '0)'); grad.addColorStop(0.35, b.col1 + (pulse * 0.8) + ')'); grad.addColorStop(0.5, b.col2 + (pulse * 1.1) + ')'); grad.addColorStop(0.65, b.col1 + (pulse * 0.8) + ')'); grad.addColorStop(1, b.col1 + '0)');
            ctx.fillStyle = grad; ctx.fill(); ctx.restore();
          });
        })();
      }

      for (var i = SH.length - 1; i >= 0; i--) {
        var s = SH[i];
        s.trail.push({ x: s.x, y: s.y }); if (s.trail.length > 28) s.trail.shift();
        s.x += s.vx; s.y += s.vy; s.life -= s.decay;
        if (s.life <= 0) { SH.splice(i, 1); continue; }
        for (var tIdx = 1; tIdx < s.trail.length; tIdx++) {
          var pct = tIdx / s.trail.length;
          ctx.beginPath(); ctx.moveTo(s.trail[tIdx - 1].x, s.trail[tIdx - 1].y); ctx.lineTo(s.trail[tIdx].x, s.trail[tIdx].y);
          ctx.strokeStyle = 'rgba(255,240,180,' + pct * s.life * 0.9 * starAlpha + ')'; ctx.lineWidth = pct * 3 * s.life; ctx.stroke();
        }
      }

      if (mtnA > 0) drawMtns(mtnA, themeT);
      if (shipA > 0) drawAirship(shipA, themeT);

      if (casA > 0) {
        drawMist(casA * 0.5, false, themeT);
        drawForest(casA, themeT);
        drawCastle(casA, themeT, false);
        drawMeadow(casA, themeT);
        drawRiver(casA, themeT);
        drawMist(casA * 0.7, true, themeT);
        drawFireflies(casA, themeT);
        drawCherryBlossomTrees(casA, themeT);
      }

      var scenePulse = Math.pow(Math.max(0, Math.sin(nt * 0.07 + 2)), 12) * themeT;
      if (scenePulse > 0.01) {
        var shimmerG = ctx.createRadialGradient(W * 0.78, H * 0.18, 0, W * 0.78, H * 0.18, W * 0.6);
        shimmerG.addColorStop(0, 'rgba(255,240,205,' + (0.16 * scenePulse) + ')');
        shimmerG.addColorStop(1, 'rgba(255,240,205,0)');
        ctx.fillStyle = shimmerG; ctx.fillRect(0, 0, W, H);
      }

      ctx.globalCompositeOperation = 'overlay';
      var fantasyGlow = ctx.createLinearGradient(0, 0, 0, H);
      fantasyGlow.addColorStop(0, 'rgba(' + lerpC('#18103c', '#1561a3', themeT) + ', 0.35)');
      fantasyGlow.addColorStop(0.5, 'rgba(' + lerpC('#2e1a5a', '#3fb0a9', themeT) + ', 0.25)');
      fantasyGlow.addColorStop(1, 'rgba(' + lerpC('#3d0f3c', '#d6be74', themeT) + ', 0.35)');
      ctx.fillStyle = fantasyGlow;
      ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'source-over';

      for (var fi = FW.length - 1; fi >= 0; fi--) {
        var fw = FW[fi];
        if (fw.phase === 'launch') {
          fw.y += fw.vy;
          var lg = ctx.createRadialGradient(fw.x, fw.y, 0, fw.x, fw.y, 8); lg.addColorStop(0, 'rgba(255,220,80,.88)'); lg.addColorStop(1, 'transparent');
          ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(fw.x, fw.y, 8, 0, Math.PI * 2); ctx.fill();
          if (fw.y <= fw.ty) explodeFW(fw);
        } else {
          fw.parts = fw.parts.filter(function (p) { return p.life > 0; });
          fw.parts.forEach(function (p) {
            p.x += p.vx; p.y += p.vy; p.vy += .046; p.vx *= .97; p.vy *= .97; p.life -= p.decay;
            if (p.life <= 0) { p.life = 0; return; }
            var pg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.s * p.life * 2.6); pg.addColorStop(0, 'hsla(' + p.hue + ',88%,' + (72 + p.life * 20) + '%,' + p.life * .85 + ')'); pg.addColorStop(1, 'transparent');
            ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(p.x, p.y, p.s * p.life * 2.6, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'hsla(' + p.hue + ',90%,' + (80 + p.life * 15) + '%,' + p.life * .75 + ')';
            ctx.beginPath(); ctx.arc(p.x, p.y, p.s * p.life, 0, Math.PI * 2); ctx.fill();
          });
          if (fw.parts.length === 0) FW.splice(fi, 1);
        }
      }

      mainRafId = requestAnimationFrame(render);
    }
    render();

    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        isTabActive = false;
        clearTimeout(fwTimeoutId);
        clearTimeout(shootTimeoutId);
        cancelAnimationFrame(mainRafId);
        if (cursorRafId) cancelAnimationFrame(cursorRafId);
      } else {
        isTabActive = true;
        lastTick = Date.now();
        render();
        if (!isTouch) cursorLoop();
        scheduleFW(); scheduleShoot();
        if (themeT < 0.5) { makeFW(W * 0.5, H * 0.4); } else { spawnPetalBurst(W * 0.5, H * 0.5); }
      }
    });

    var PC = ['#c9a227', '#f0c84a', '#faeab1', '#2a9d8f', '#52c9b9', '#fff'], lastP = 0;
    if (!isTouch) {
      document.addEventListener('mousemove', function (ev) { var n = Date.now(); if (n - lastP < 32) return; lastP = n; spark(ev.clientX, ev.clientY); if (Math.random() > .7) spark(ev.clientX, ev.clientY); });
    }
    function spark(x, y, burst) {
      var p = document.createElement('div'); p.className = 'an-spark';
      var c = PC[Math.floor(Math.random() * PC.length)], sz = Math.random() * 5 + 2;
      var sp = burst ? Math.random() * 70 + 28 : Math.random() * 26 + 5, ang = Math.random() * Math.PI * 2;
      p.style.cssText = 'width:' + sz + 'px;height:' + sz + 'px;left:' + (x - sz / 2) + 'px;top:' + (y - sz / 2) + 'px;background:' + c + ';box-shadow:0 0 5px ' + c + ';';
      p.style.setProperty('--tx', Math.cos(ang) * sp + 'px'); p.style.setProperty('--ty', Math.sin(ang) * sp + (burst ? 0 : 12) + 'px');
      document.body.appendChild(p); setTimeout(function () { p.remove(); }, 800);
    }

    var SYMS = ['∑', '∫', '≈', 'Δ', 'μ', 'σ', 'λ', '∞', 'θ', 'π', 'β', 'ε', '{}', 'f(x)', 'def', '∂', '∇'];
    var SCOL = ['rgba(201,162,39,O)', 'rgba(42,157,143,O)', 'rgba(240,200,74,O)', 'rgba(210,200,240,O)'];
    var storm = document.createElement('div'); storm.id = 'an-storm'; document.body.appendChild(storm);
    for (var i = 0; i < 22; i++) {
      var el = document.createElement('div'); el.className = 'an-sym';
      var op = (Math.random() * .07 + .04).toFixed(2);
      var col = SCOL[Math.floor(Math.random() * SCOL.length)].replace('O', op);
      el.innerText = SYMS[Math.floor(Math.random() * SYMS.length)];
      el.style.color = col; el.style.textShadow = '0 0 8px ' + col;
      el.style.fontSize = (Math.random() * .85 + .6) + 'rem'; el.style.left = (Math.random() * 100) + 'vw';
      var dur = Math.random() * 16 + 12;
      el.style.animationDuration = dur + 's'; el.style.animationDelay = '-' + (Math.random() * dur) + 's';
      el.style.setProperty('--r', (Math.random() * 360 - 180) + 'deg'); el.style.setProperty('--op', op);
      storm.appendChild(el);
    }

    var obs = new IntersectionObserver(function (entries, o) { entries.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('reveal-visible'); o.unobserve(e.target); } }); }, { threshold: .1 });
    document.querySelectorAll('.reveal-item').forEach(function (el) { obs.observe(el); });

    document.querySelectorAll('.btn-cta-project,.tech-tag,.back-btn').forEach(function (btn) {
      btn.addEventListener('mousemove', function (ev) { var r = btn.getBoundingClientRect(); btn.style.transform = 'translate(' + (ev.clientX - r.left - r.width / 2) * .14 + 'px,' + (ev.clientY - r.top - r.height / 2) * .14 + 'px) scale(1.04)'; btn.style.transition = 'transform .1s ease-out'; });
      btn.addEventListener('mouseleave', function () { btn.style.transform = ''; btn.style.transition = 'all .45s cubic-bezier(.25,1,.5,1)'; });
    });

    function fixSidebar() {
      document.querySelectorAll('.author__urls-wrapper nav,.author__urls-wrapper .author__urls').forEach(function (el) { el.style.cssText = 'display:flex!important;flex-direction:column!important;gap:8px!important;margin-top:12px!important;padding-top:12px!important;border-top:1px solid rgba(201,162,39,.14)!important;opacity:1!important;visibility:visible!important;position:static!important;width:auto!important;height:auto!important;overflow:visible!important;'; });
      document.querySelectorAll('.author__urls-wrapper button,.author__urls-wrapper [class*=\"btn\"]').forEach(function (el) { el.style.cssText = 'display:none!important;height:0!important;visibility:hidden!important;pointer-events:none!important;margin:0!important;padding:0!important;border:none!important;'; });
      document.querySelectorAll('.author__urls a,.sidebar a').forEach(function (a) { if (a.href && !a.href.startsWith('mailto') && !a.href.includes(window.location.hostname + window.location.pathname)) { a.target = '_blank'; a.rel = 'noopener noreferrer'; } });
    }
    fixSidebar(); setTimeout(fixSidebar, 500); setTimeout(fixSidebar, 1500);

    var topBtn = document.createElement('button'); topBtn.id = 'an-top';
    topBtn.innerHTML = '<img src="/assets/images/kanade-chibi.png" alt="Top"><span>Back to top</span>';
    topBtn.onclick = function () { window.scrollTo({ top: 0, behavior: 'smooth' }); };
    document.body.appendChild(topBtn);
    window.addEventListener('scroll', function () { topBtn.classList.toggle('show', window.scrollY > 300); }, { passive: true });

    window.addEventListener('pageshow', function () {
      document.body.style.overflow = '';
      var ov = document.getElementById('an-overlay'), bk = document.getElementById('an-book');
      if (ov) { ov.style.opacity = '0'; ov.style.pointerEvents = 'none'; }
      if (bk) anBookReset(bk);
      updateAlpha(); fixSidebar();
    });

    (function () {
      var KTHEME = 'an_theme', KTS = 'an_ts', KACT = 'an_act', TTL = 300000;
      setTimeout(function () {
        var d = document.body.classList.contains('an-day-mode');
        ['an-theme-icon-desktop', 'an-theme-icon-mobile'].forEach(function (id) {
          var ic = document.getElementById(id);
          if (!ic) return;
          ic.className = ic.className.replace(/fa-sun|fa-moon/g, '').trim();
          ic.classList.add(d ? 'fa-moon' : 'fa-sun');
        });
      }, 80);

      new MutationObserver(function () {
        try {
          var d = document.body.classList.contains('an-day-mode');
          sessionStorage.setItem(KTHEME, d ? 'day' : 'night'); sessionStorage.setItem(KTS, Date.now());
        } catch (e) { }
      }).observe(document.body, { attributes: true, attributeFilter: ['class'] });

      function ping() { try { sessionStorage.setItem(KACT, Date.now()); } catch (e) { } }
      setInterval(ping, 30000);
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) {
          try {
            if (Date.now() - (+sessionStorage.getItem(KACT) || 0) > TTL) {
              sessionStorage.removeItem(KTHEME); sessionStorage.removeItem(KTS); document.body.classList.remove('an-day-mode');
            }
          } catch (e) { }
        }
        ping();
      });

      document.addEventListener('click', function (e) {
        var btn = e.target.closest('#an-theme-toggle-desktop,#an-theme-toggle-mobile');
        if (!btn) return;
        e.preventDefault(); e.stopImmediatePropagation();
        var blocker = document.getElementById('an-theme-blocker');
        if (blocker) blocker.remove();
        document.body.classList.toggle('an-day-mode');
        var nd = document.body.classList.contains('an-day-mode');
        ['an-theme-icon-desktop', 'an-theme-icon-mobile'].forEach(function (id) {
          var ic = document.getElementById(id);
          if (!ic) return;
          ic.className = ic.className.replace(/fa-sun|fa-moon/g, '').trim();
          ic.classList.add(nd ? 'fa-moon' : 'fa-sun');
        });
      }, true);
    })();
  });

  /* Block click/redirect trên page title & author namee */
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('.page__title, .author__name').forEach(function (el) {
      var anchor = el.closest('a');
      if (anchor) {
        anchor.addEventListener('click', function (e) { e.preventDefault(); });
        anchor.style.cursor = 'default';
      }
      el.style.cursor = 'default';
    });
  });

  /* Vignette, film grain, typewriter tagline */
  document.addEventListener('DOMContentLoaded', function () {
    var vig = document.createElement('div'); vig.id = 'an-vignette'; document.body.appendChild(vig);
    var grain = document.createElement('div'); grain.id = 'an-grain'; document.body.appendChild(grain);

    var bio = document.querySelector('.author__bio');
    if (bio) {
      var original = bio.textContent.trim();
      bio.textContent = '';
      var cursor = document.createElement('span');
      cursor.className = 'author__bio-cursor'; cursor.textContent = '|';
      bio.appendChild(cursor);
      var i = 0;
      setTimeout(function () {
        var timer = setInterval(function () {
          if (i < original.length) {
            bio.insertBefore(document.createTextNode(original[i]), cursor); i++;
          } else {
            clearInterval(timer);
            setTimeout(function () {
              cursor.style.transition = 'opacity 0.5s'; cursor.style.opacity = '0';
              setTimeout(function () { cursor.remove(); }, 500);
            }, 2500);
          }
        }, 52);
      }, 1500);
    }
  });
</script>
